name: food_delivery
description: "YumQuick: a food delivery app built for the Bictree Flutter task."
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # State management
  flutter_bloc: ^9.1.0
  bloc_concurrency: ^0.3.0
  stream_transform: ^2.1.1
  equatable: ^2.0.7

  # Dependency injection
  get_it: ^8.0.3

  # Networking
  dio: ^5.8.0

  # Navigation
  go_router: ^14.8.1

  # Local storage: tokens in secure storage, cart and offline cache in Hive
  flutter_secure_storage: ^9.2.4
  hive_ce: ^2.10.0
  hive_ce_flutter: ^2.2.0

  # UI
  cached_network_image: ^3.4.1
  skeletonizer: ^1.4.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  bloc_test: ^10.0.0
  mocktail: ^1.0.4

flutter:
  uses-material-design: true
